[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulseguard"
version = "0.1.0"
description = "Event-preserving residual PPG filtering implementation"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "torch>=2.2", "matplotlib>=3.7"]

[project.scripts]
pulseguard = "pulseguard.cli:main"

[tool.setuptools.packages.find]
include = ["pulseguard*"]
